name: 'Custom steps to run after R packages are installed'

runs:
  using: "composite"
  steps:
    # The tests of the example package call `indiedown::expect_pdf_snapshot()`.
    # At this point the library holds no copy of the commit under test:
    # the binary is built and installed only after the custom steps,
    # so the library has either no indiedown or a stale one restored from the package cache,
    # which lacks the function that the commit adds.
    - name: Install the package under test
      run: |
        R CMD INSTALL .
      shell: bash

    - name: Run R CMD check on example package
      run: |
        options(crayon.enabled = TRUE)
        error_on <- "note"
        rcmdcheck::rcmdcheck("inst/mypackage", args = c("--no-manual", "--as-cran"), error_on = "warning", check_dir = "inst/mypackage/check")
      shell: Rscript {0}

    - name: Remove check output
      run: |
        rm -r inst/mypackage/check
      shell: bash
